  repository: "github.com/hanxinzhang/prime-bound"
  commit: "2319570b0056676537190512f20af80d3a7b72a7"   # head of main, 2026-09-02T01:36:47Z; first commit 7a606fc8 'New repo' 2026-08-28
  tree: "eced14cc4315457488af6b3d2cc4debffa30e038"
  files_from_api:   # size and git blob id; sha256 is recorded at fetch in checks/manifest.json
    - {path: README.md, size: 7308, blob: 595008be6fce}
